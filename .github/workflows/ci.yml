name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code validator
        run: |
          curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/install-claude.sh"
          bash "$RUNNER_TEMP/install-claude.sh" 2.1.316
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: .cd-cache
          key: cd-grammars-${{ hashFiles('requirements-dev.txt') }}
      - name: Tests
        run: uv run --with-requirements requirements-dev.txt python -m pytest -q
      - name: Lint knowledge base
        run: python3 scripts/lint_kb.py src/knowledge
      - name: Build freshness check
        run: python3 scripts/build.py --check
      - name: Rebuild and verify committed dist is current
        run: |
          python3 scripts/build.py
          git diff --exit-code dist/ .claude-plugin/ .agents/
          test -z "$(git status --porcelain dist/ .claude-plugin/ .agents/)"
      - name: Validate Claude Code plugin
        run: claude plugin validate --strict dist/claude-code
      - name: Validate marketplace root
        run: claude plugin validate .
